version: 3
name: custom
displayName: Custom Servers
registry:
  magic:
    description: Magic server (local)
    command:
      - npx
      - "@21st-dev/magic"
  morphllm-fast-apply:
    description: Morph LLM Fast Apply (local)
    command:
      - npx
      - "@morph-llm/morph-fast-apply"
  serena:
    description: Serena server (local)
    command:
      - uvx
      - "--from"
      - "git+https://github.com/oraios/serena"
      - "serena"
      - "start-mcp-server"
      - "--context"
      - "ide-assistant"
  chrome-devtools:
    description: Chrome DevTools server (local)
    command:
      - npx
      - "-y"
      - "chrome-devtools-mcp@latest"
  skillport:
    description: SkillPort MCP server (local)
    command:
      - uvx
      - "skillport-mcp"
