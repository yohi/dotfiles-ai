defaults:
  gateway_url: "http://127.0.0.1:10888/sse"
servers:
  SQLite:
    title: "SQLite"
    description: "SQLite database access and management."
    type: server
    image: mcp/sqlite:latest
    args:
      - "/mcp/sqlite.db"
    volumes:
      - "__HOME__/.mcp/sqlite:/mcp"
  filesystem:
    title: "Filesystem"
    description: "Local filesystem access with restricted paths."
    type: server
    image: docker.io/mcp/filesystem:latest
    command:
      - "__HOME__"
      - "__REPO_ROOT__"
    volumes:
      - "__HOME__:__HOME__"
      - "__REPO_ROOT__:__REPO_ROOT__"
  github-official:
    description: "Official GitHub MCP server for repository management."
    type: server
    image: mcp/github:latest
    env:
      - name: GITHUB_PERSONAL_ACCESS_TOKEN
        value: "${GITHUB_TOKEN:-placeholder_set_GITHUB_TOKEN_in_env}"
  sequentialthinking:
    title: "Sequential Thinking"
    description: "A tool for sequential problem solving and logical reasoning."
    type: server
    image: mcp/sequentialthinking:latest
  chronos-graph:
    title: "ChronosGraph"
    description: "Long-term memory and knowledge graph system."
    type: local
    command:
      - uv
      - run
      - --project
      - "${CHRONOS_GRAPH_PATH:-__PROGRAM__/chronos-graph}"
      - -m
      - context_store
    env:
      - name: STORAGE_BACKEND
        value: "sqlite"
      - name: SQLITE_DB_PATH
        value: "__HOME__/.context-store/memories.db"
      - name: GRAPH_ENABLED
        value: "true"
      - name: DECAY_HALF_LIFE_DAYS
        value: "30"
      - name: SIMILARITY_THRESHOLD
        value: "0.70"
      - name: DEDUP_THRESHOLD
        value: "0.90"
      - name: EMBEDDING_PROVIDER
        value: "local-model"
      - name: LOCAL_MODEL_NAME
        value: "cl-nagoya/ruri-v3-310m"

  nexus:
    title: "Nexus"
    description: "Local knowledge base and indexer."
    type: local
    command:
      - "node"
      - "__PROGRAM__/nexus/dist/bin/nexus.js"
    args:
      - "--project-root"
      - "__PROGRAM__/nexus"
    env:
      - name: NEXUS_STORAGE_ROOT_DIR
        value: "__PROGRAM__/nexus/.nexus"
      - name: NEXUS_WATCHER_IGNORE_PATHS
        value: "node_modules,.git,.nexus,dist,gemini,.worktrees,.venv,target,.mypy_cache,.ruff_cache,build,.serena,.cache,__pycache__,*.db,*.sqlite,*.log,out,bundle,vendor,package-lock.json,yarn.lock,pnpm-lock.yaml"
      - name: CHOKIDAR_USEPOLLING
        value: "false"
      - name: CHOKIDAR_INTERVAL
        value: "2000"
      - name: NO_PROXY
        value: "127.0.0.1,localhost"

  atlassian:
    title: "Atlassian"
    description: "Atlassian (Jira/Confluence) official MCP server."
    type: sse
    url: "https://mcp.atlassian.com/v1/mcp"

  skillport:
    title: "Skillport"
    description: "Professional development and AI skill management toolkit."
    type: local
    command:
      - "__HOME__/.local/bin/skillport-mcp"
    env:
      - name: SKILLPORT_SKILLS_DIR
        value: "__REPO_ROOT__/agent-skills"
      - name: SKILLS_DIR
        value: "__REPO_ROOT__/agent-skills"
      - name: SKILLPORT_DB_PATH
        value: "__HOME__/.skillport/db/skills"
      - name: DB_PATH
        value: "__HOME__/.skillport/db/skills"

  docker-mcp:
    title: "Docker MCP Gateway"
    description: "SSE gateway for containerized MCP servers."
    type: sse
    url: "__GATEWAY_URL__"
    _generated_by: "gateway"

  docker-mcp-local:
    title: "Docker MCP Gateway (Local)"
    description: "Local stdio gateway for containerized MCP servers."
    type: local
    command:
      - docker
      - mcp
      - gateway
      - run
    args:
      - "--config"
      - "__HOME__/.docker/mcp/config.yaml"
      - "--catalog"
      - "__HOME__/.docker/mcp/catalogs/bootstrap.yaml"
      - "--catalog"
      - "__HOME__/.docker/mcp/catalogs/custom.yaml"

agents:
  gemini:
    path: "gemini/settings.json"
    format: "json"
    root_key: "mcpServers"
    servers:
      docker-mcp: { inherit: "docker-mcp" }
      skillport: { inherit: "skillport" }
      atlassian: { inherit: "atlassian", url_key: "httpUrl" }
      chronos-graph: { inherit: "chronos-graph" }
      nexus: { inherit: "nexus" }

  claude:
    path: ".claude.json"
    format: "json"
    root_key: "mcpServers"
    project_key: "__REPO_ROOT__"
    servers:
      docker-mcp: { inherit: "docker-mcp" }
      skillport: { inherit: "skillport" }
      atlassian: { inherit: "atlassian" }
      chronos-graph: { inherit: "chronos-graph" }
      nexus: { inherit: "nexus" }

  opencode:
    path: "opencode/opencode.jsonc"
    format: "opencode_jsonc"
    root_key: "mcp"
    servers:
      docker-mcp: { inherit: "docker-mcp-local" }
      skillport: { inherit: "skillport" }
      chronos_graph: { inherit: "chronos-graph" }
      nexus: { inherit: "nexus" }

  vscode:
    path: "ide/vscode/settings.json"
    format: "json"
    root_key: "mcpServers"
    servers:
      docker-mcp: { inherit: "docker-mcp" }
      skillport: { inherit: "skillport" }
      chronos-graph: { inherit: "chronos-graph" }
      nexus: { inherit: "nexus" }

  cursor:
    path: ".cursor/mcp.json"
    format: "json"
    root_key: "mcpServers"
    servers:
      docker-mcp: { inherit: "docker-mcp" }
      skillport: { inherit: "skillport" }
      chronos-graph: { inherit: "chronos-graph" }
      nexus: { inherit: "nexus" }

  antigravity:
    path: ".gemini/antigravity/mcp_config.json"
    format: "json"
    root_key: "mcpServers"
    url_key: "serverUrl"
    servers:
      docker-mcp: { inherit: "docker-mcp" }
      skillport: { inherit: "skillport" }
      chronos-graph: { inherit: "chronos-graph" }
      nexus: { inherit: "nexus" }

  codex:
    path: "codex/config.toml"
    format: "toml"
    root_key: "mcp_servers"
    servers:
      docker-mcp: { inherit: "docker-mcp" }
      skillport: { inherit: "skillport" }
      chronos-graph: { inherit: "chronos-graph" }
      nexus: { inherit: "nexus" }
