defaults:
  gateway_name: docker-mcp-gateway
  gateway_url: http://127.0.0.1:10888/sse

# chronos-graph is a local MCP server that runs via 'uv' on each client (not managed by Docker gateway)
_chronos_graph_legacy: &chronos_graph_legacy
  command: uv
  args:
    - --quiet
    - tool
    - run
    - --from
    - git+https://github.com/yohi/chronos-graph.git@37308f47837469d801abc1226ee65e4262093042
    - context-store
  env:
    STORAGE_BACKEND: sqlite
    SQLITE_DB_PATH: __HOME__/.context-store/memories.db
    GRAPH_ENABLED: "true"
    EMBEDDING_PROVIDER: local
    LOCAL_MODEL_NAME: "cl-nagoya/ruri-v3-310m"

_chronos_graph_modern: &chronos_graph_modern
  type: local
  command:
    - uv
    - --quiet
    - tool
    - run
    - --from
    - git+https://github.com/yohi/chronos-graph.git@37308f47837469d801abc1226ee65e4262093042
    - context-store
  environment:
    STORAGE_BACKEND: sqlite
    SQLITE_DB_PATH: __HOME__/.context-store/memories.db
    GRAPH_ENABLED: "true"
    EMBEDDING_PROVIDER: local
    LOCAL_MODEL_NAME: "cl-nagoya/ruri-v3-310m"

notes:
  codex: Codex CLI MCP configuration is not managed here because this repository does not currently contain a supported Codex MCP config surface.

agents:
  claude:
    path: claude/claude-settings.json
    format: json
    root_key: mcpServers
    servers:
      docker-mcp-gateway:
        type: sse
        url: __GATEWAY_URL__
        headers:
          Authorization: Bearer ${MCP_GATEWAY_TOKEN}

      chronos-graph: *chronos_graph_legacy

  gemini:
    path: gemini/settings.json
    format: json
    root_key: mcpServers
    servers:
      docker-mcp-gateway:
        type: sse
        url: http://127.0.0.1:10888/sse
        headers:
          Authorization: Bearer ${MCP_GATEWAY_TOKEN}
        timeout: 60000

      atlassian:
        type: sse
        httpUrl: https://mcp.atlassian.com/v1/mcp
        timeout: 30000

      chronos-graph: *chronos_graph_legacy

  antigravity:
    path: antigravity/mcp_config.json
    format: generated_json
    root_key: mcpServers
    servers:
      docker-mcp-gateway:
        serverUrl: __GATEWAY_URL__

      chronos-graph: *chronos_graph_legacy

  cursor:
    path: ide/cursor/mcp.json
    format: generated_json
    root_key: mcpServers
    servers:
      docker-mcp-gateway:
        url: __GATEWAY_URL__

      chronos-graph: *chronos_graph_legacy

  vscode:
    path: ide/vscode/settings.json
    format: jsonc
    root_key: mcpServers
    servers:
      docker-mcp-gateway:
        url: __GATEWAY_URL__

      chronos-graph: *chronos_graph_legacy

  opencode:
    path: opencode/opencode.jsonc
    format: opencode_jsonc
    root_key: mcp
    servers:
      docker-mcp-gateway:
        type: remote
        url: __GATEWAY_URL__
        enabled: true
        headers:
          Authorization: Bearer ${MCP_GATEWAY_TOKEN}

      chronos-graph: *chronos_graph_modern
