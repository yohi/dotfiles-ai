defaults:
  gateway_name: docker-mcp-gateway
  gateway_url: http://127.0.0.1:10888/sse

notes:
  codex: Codex CLI MCP configuration is not managed here because this repository does not currently contain a supported Codex MCP config surface.

agents:
  claude:
    path: claude/claude-settings.json
    format: json
    root_key: mcpServers
    servers:
      docker-mcp-gateway:
        type: sse
        url: __GATEWAY_URL__

  gemini:
    path: gemini/settings.json
    format: json
    root_key: mcpServers
    servers:
      docker-mcp-gateway:
        type: sse
        url: __GATEWAY_URL__
        timeout: 30000
      atlassian:
        command: npx
        args:
          - -y
          - mcp-remote
          - https://mcp.atlassian.com/v1/mcp
        env:
          PORT: "0"

  antigravity:
    path: antigravity/mcp_config.json
    format: generated_json
    root_key: mcpServers
    servers:
      docker-mcp-gateway:
        type: sse
        serverUrl: __GATEWAY_URL__

  cursor:
    path: ide/cursor/mcp.json
    format: generated_json
    root_key: mcpServers
    servers:
      docker-mcp-gateway:
        url: __GATEWAY_URL__

  vscode:
    path: ide/vscode/settings.json
    format: jsonc
    root_key: mcpServers
    servers:
      docker-mcp-gateway:
        url: __GATEWAY_URL__

  opencode:
    path: opencode/opencode.jsonc
    format: opencode_jsonc
    root_key: mcp
    servers:
      docker-mcp-gateway:
        type: remote
        url: __GATEWAY_URL__
        enabled: true
