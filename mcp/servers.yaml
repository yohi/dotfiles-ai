defaults:
  gateway_url: "http://127.0.0.1:10888/sse"

servers:
  SQLite:
    type: server
    image: ghcr.io/yohi/mcp-sqlite:latest
    volumes:
      - "__HOME__/.mcp/sqlite:/mcp"
  filesystem:
    type: server
    image: ghcr.io/yohi/mcp-filesystem:latest
    volumes:
      - "__HOME__:/home/y_ohi"
      - "__REPO_ROOT__:__REPO_ROOT__"
  github-official:
    type: server
    image: mcp/github:latest
    env:
      - name: GITHUB_PERSONAL_ACCESS_TOKEN
        value: "${GITHUB_TOKEN}"
  sequentialthinking:
    type: server
    image: mcp/sequentialthinking:latest
  skillport:
    type: server
    image: ghcr.io/yohi/skillport:latest
    command:
      - --reindex
    env:
      - name: SKILLPORT_SKILLS_DIR
        value: "__REPO_ROOT__/agent-skills"
      - name: SKILLS_DIR
        value: "__REPO_ROOT__/agent-skills"
      - name: SKILLPORT_DB_PATH
        value: "/mcp/db"
      - name: DB_PATH
        value: "/mcp/db"
    volumes:
      - "__HOME__/.skillport/db:/mcp/db"
      - "__HOME__/.skillport:__HOME__/.skillport"
      - "__REPO_ROOT__:__REPO_ROOT__:ro"

agents:
  gemini:
    path: "gemini/settings.json"
    format: "json"
    root_key: "mcpServers"
    servers:
      SQLite: { inherit: "SQLite" }
      filesystem: { inherit: "filesystem" }
      github-official: { inherit: "github-official" }
      sequentialthinking: { inherit: "sequentialthinking" }
      skillport: { inherit: "skillport" }
