name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Integrity & Regression Checks
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Git history is needed for test_no_hardcoded_personal_paths_in_repo (git ls-files)

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext-base

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: |
        uv sync

    - name: Install APM and Synchronize Configs
      run: |
        uv tool install ./oss/apm --force
        apm install --force
        apm compile
        make sync-mcp-gateway

    - name: Run Integrity Tests
      run: |
        make test-integrity

    - name: Run All Tests
      run: |
        make test
