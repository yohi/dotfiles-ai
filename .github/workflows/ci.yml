name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Integrity & Regression Checks
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Git history is needed for test_no_hardcoded_personal_paths_in_repo (git ls-files)

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext-base

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Render MCP Configs
      run: |
        # Generate initial config files from templates and render placeholders
        # We skip the full 'make sync-mcp' because it tries to restart systemd services
        bash _scripts/sync-mcp-configs.sh || true # Ignore systemd restart failures in CI

    - name: Run Integrity Tests
      run: |
        make test-integrity

    - name: Run All Tests
      run: |
        make test
