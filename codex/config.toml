model = "gpt-5.4"
model_reasoning_effort = "high"
[notice]
hide_rate_limit_model_nudge = true

# OpenAI Codex CLI Configuration
#
# For more information on configuration options, see the official documentation.

# Set the default model to use for requests.
# model = "gpt-5"

# Set the approval mode. Options are: suggest, auto-edit, full-auto
# approval_policy = "on-request"

# You can also configure a different model provider, like Ollama
# model_provider = "ollama"

# UAACS:META-PROMPT
# 拡張スキル: ../agent-skills/ (各 SKILL.md を参照)
# コーディングルール: ../global-rules/ (MARKDOWN.md, SHELL.md, DOCS_STYLE.md, GIT_STANDARDS.md)


[model_providers.flixa]
name = "flixa"
base_url = "https://api.flixa.engineer/v1/agent"
wire_api = "responses"

[projects."/home/y_ohi/program/nexus"]
trust_level = "trusted"

[projects."/home/y_ohi/dotfiles/components/dotfiles-ai"]
trust_level = "trusted"

[mcp_servers.docker-mcp]
type = "sse"
url = "http://127.0.0.1:10888/sse"
args = ["-H", "Authorization: Bearer ceba07f89532f3ba19d226ed4108b4b4"]

[mcp_servers.skillport]
command = "/home/y_ohi/.local/bin/skillport-mcp"
args = []
env = { SKILLPORT_SKILLS_DIR = "/home/y_ohi/dotfiles/components/dotfiles-ai/agent-skills", SKILLS_DIR = "/home/y_ohi/dotfiles/components/dotfiles-ai/agent-skills", SKILLPORT_DB_PATH = "/home/y_ohi/.skillport/db/skills", DB_PATH = "/home/y_ohi/.skillport/db/skills" }

[mcp_servers.chronos-graph]
command = "uv"
args = ["run", "--project", "/home/y_ohi/program/private/chronos-graph", "-m", "context_store"]
env = { STORAGE_BACKEND = "sqlite", SQLITE_DB_PATH = "/home/y_ohi/.context-store/memories.db", GRAPH_ENABLED = "true", DECAY_HALF_LIFE_DAYS = "30", SIMILARITY_THRESHOLD = "0.70", DEDUP_THRESHOLD = "0.90", EMBEDDING_PROVIDER = "local-model", LOCAL_MODEL_NAME = "cl-nagoya/ruri-v3-310m" }

[mcp_servers.nexus]
command = "node"
args = ["/home/y_ohi/program/private/nexus/dist/bin/nexus.js", "--project-root", "/home/y_ohi/program/private/nexus"]
env = { NEXUS_STORAGE_ROOT_DIR = "/home/y_ohi/program/private/nexus/.nexus", NEXUS_WATCHER_IGNORE_PATHS = "node_modules,.git,.nexus,dist,gemini,.worktrees,.venv,target,.mypy_cache,.ruff_cache,build,.serena,.cache,__pycache__,*.db,*.sqlite,*.log,out,bundle,vendor,package-lock.json,yarn.lock,pnpm-lock.yaml", CHOKIDAR_USEPOLLING = "false", CHOKIDAR_INTERVAL = "2000", NO_PROXY = "127.0.0.1,localhost" }
