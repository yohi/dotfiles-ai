---
# Codacy configuration file
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/

exclude_paths:
  # AGENTS.md contains AI-specific instructions with RFC 2119 keywords (MUST, NEVER, etc.)
  # which trigger false positives for "Undefined acronym" and "Absolute rule without escape hatch".
  # Per AGENTMS-MD_BESTPRACTICE.md Section 10, we exclude it to prioritize instruction clarity.
  - "AGENTS.md"
  - "AGENTMS-MD_BESTPRACTICE.md"
  - "tests/**"
  # The following CLAUDE.md variants are generated instruction files managed by APM CLI.
  # They share the same directive-heavy content as AGENTS.md and trigger identical false positives.
  - "CLAUDE.md"
  - ".github/CLAUDE.md"
  - "claude/CLAUDE.md"
