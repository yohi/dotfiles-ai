mcp_servers:
- atlassian
- aws-documentation
- aws-iac
- aws-mcp
- chronos-graph
- codegraph
- coderabbit
- filesystem
- github-official
- greptile
- nexus
- semgrep
- sentry-remote
- sequentialthinking
- skillport
- sonarqube
mcp_configs:
  atlassian:
    name: atlassian
    transport: sse
    registry: false
    url: https://mcp.atlassian.com/v1/mcp/authv2
    title: Atlassian MCP
    enabled: true
  aws-documentation:
    name: aws-documentation
    transport: stdio
    env:
      FASTMCP_LOG_LEVEL: ERROR
      AWS_DOCUMENTATION_PARTITION: ${env:AWS_DOCUMENTATION_PARTITION:-aws}
    args:
    - awslabs.aws-documentation-mcp-server==1.0.0
    registry: false
    command: uvx
    title: AWS Documentation MCP
    standalone: true
    enabled: true
  aws-iac:
    name: aws-iac
    transport: stdio
    env:
      AWS_PROFILE: ${env:AWS_PROFILE:-default}
      AWS_REGION: ${env:AWS_REGION:-us-east-1}
      FASTMCP_LOG_LEVEL: ERROR
    args:
    - awslabs.aws-iac-mcp-server
    registry: false
    command: uvx
    title: AWS IaC MCP
    standalone: true
    timeout: 60000
    enabled: true
  aws-mcp:
    name: aws-mcp
    transport: sse
    registry: false
    url: https://aws-mcp.us-east-1.api.aws/mcp?oauth=initialize
    title: AWS Managed MCP
    enabled: true
  chronos-graph:
    name: chronos-graph
    transport: stdio
    env:
      STORAGE_BACKEND: ${env:STORAGE_BACKEND}
      GRAPH_ENABLED: ${env:GRAPH_ENABLED}
      POSTGRES_HOST: ${env:POSTGRES_HOST}
      POSTGRES_PORT: ${env:POSTGRES_PORT}
      POSTGRES_DB: ${env:POSTGRES_DB}
      POSTGRES_USER: ${env:POSTGRES_USER}
      POSTGRES_PASSWORD: ${env:POSTGRES_PASSWORD}
      POSTGRES_SSL: ${env:POSTGRES_SSL}
      NEO4J_URI: ${env:NEO4J_URI}
      NEO4J_USER: ${env:NEO4J_USER}
      NEO4J_PASSWORD: ${env:NEO4J_PASSWORD}
      CACHE_BACKEND: ${env:CACHE_BACKEND}
      REDIS_URL: ${env:REDIS_URL}
      REDIS_SSL: ${env:REDIS_SSL}
      EMBEDDING_PROVIDER: ${env:EMBEDDING_PROVIDER}
      LOCAL_MODEL_NAME: ${env:LOCAL_MODEL_NAME}
      EMBEDDING_DIMENSION: ${env:EMBEDDING_DIMENSION}
      SIMILARITY_THRESHOLD: ${env:SIMILARITY_THRESHOLD}
      DEDUP_THRESHOLD: ${env:DEDUP_THRESHOLD}
      DEFAULT_TOP_K: ${env:DEFAULT_TOP_K}
      DECAY_HALF_LIFE_DAYS: ${env:DECAY_HALF_LIFE_DAYS}
      ARCHIVE_THRESHOLD: ${env:ARCHIVE_THRESHOLD}
      PURGE_RETENTION_DAYS: ${env:PURGE_RETENTION_DAYS}
      DASHBOARD_HOST: ${env:DASHBOARD_HOST}
      DASHBOARD_PORT: ${env:DASHBOARD_PORT}
    args:
    - --from
    - context-store-mcp[all] @ https://github.com/yohi/chronos-graph/archive/refs/tags/v3.0.1.tar.gz
    - context-store
    registry: false
    command: uvx
    title: Chronos Graph
    standalone: true
    timeout: 120000
    enabled: true
  codegraph:
    name: codegraph
    transport: stdio
    args:
    - serve
    - --mcp
    registry: false
    command: _scripts/codegraph-bootstrap.sh
    title: CodeGraph MCP
    enabled: true
  coderabbit:
    name: coderabbit
    transport: stdio
    env:
      GITHUB_PAT: ${env:GITHUB_TOKEN}
    args:
    - -y
    - coderabbitai-mcp
    registry: false
    command: npx
    title: CodeRabbit MCP
    timeout: 60000
    enabled: true
  filesystem:
    name: filesystem
    transport: stdio
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - ${env:PWD}
    registry: false
    command: npx
    title: Filesystem MCP
    standalone: true
    timeout: 60000
    enabled: true
  github-official:
    name: github-official
    transport: sse
    registry: false
    headers:
      Authorization: Bearer ${env:GITHUB_TOKEN}
    url: https://api.githubcopilot.com/mcp/
    title: GitHub Official MCP
    standalone: true
    enabled: true
  greptile:
    name: greptile
    transport: sse
    registry: false
    headers:
      Authorization: Bearer ${env:GREPTILE_API_KEY}
      X-GitHub-Token: ${env:GITHUB_TOKEN}
    url: https://api.greptile.com/mcp
    title: Greptile MCP
    enabled: true
  nexus:
    name: nexus
    transport: stdio
    env:
      LOG_LEVEL: ERROR
      NEXUS_WATCHER_IGNORE_PATHS: node_modules,opencode/node_modules,.opencode/node_modules,oss/apm/node_modules,oss/apm/docs/node_modules,.git,.nexus,dist,gemini,agent-skills,apm_modules,.agents,.opencode,.gemini,.claude,.codex,.vscode,.devcontainer,oss,codex/.tmp,.worktrees,.venv,target,.mypy_cache,.ruff_cache,build,.serena,.cache,__pycache__,*.db,*.sqlite,*.log
      CHOKIDAR_USEPOLLING: 'false'
      CHOKIDAR_INTERVAL: '2000'
      NO_PROXY: 127.0.0.1,localhost
    args:
    - -y
    - '@yohi/nexus@1.31.4'
    - http-bridge
    registry: false
    command: npx
    title: Nexus
    timeout: 60000
    standalone: true
    enabled: true
  semgrep:
    name: semgrep
    transport: stdio
    env:
      SEMGREP_APP_TOKEN: ${env:SEMGREP_APP_TOKEN}
    args:
    - semgrep-mcp
    - -t
    - stdio
    - --semgrep-path
    - ${env:HOME}/.local/bin/semgrep
    registry: false
    command: uvx
    title: Semgrep MCP
    enabled: true
    timeout: 60000
  sentry-remote:
    name: sentry-remote
    transport: sse
    registry: false
    url: https://mcp.sentry.dev/mcp
    title: Sentry Remote MCP
    enabled: true
  sequentialthinking:
    name: sequentialthinking
    transport: stdio
    env:
      DISABLE_THOUGHT_LOGGING: ${env:DISABLE_THOUGHT_LOGGING:-true}
    args:
    - -y
    - '@modelcontextprotocol/server-sequential-thinking'
    registry: false
    command: npx
    title: Sequential Thinking MCP
    standalone: true
    timeout: 60000
    enabled: true
  skillport:
    name: skillport
    transport: stdio
    env:
      SKILLPORT_SKILLS_DIR: ${env:SKILLPORT_SKILLS_DIR:-.agents/skills}
    args:
    - skillport-mcp
    registry: false
    command: uvx
    title: Skillport
    standalone: true
    timeout: 60000
    enabled: true
  sonarqube:
    name: sonarqube
    transport: stdio
    env:
      SONARQUBE_TOKEN: ${env:SONARQUBE_TOKEN}
      SONARQUBE_URL: ${env:SONARQUBE_URL}
      SONARQUBE_ORG: ${env:SONARQUBE_ORG}
    args:
    - -y
    - sonarqube-mcp-server
    registry: false
    command: npx
    title: SonarQube MCP
    timeout: 60000
    enabled: true
mcp_target_servers:
  opencode:
  - atlassian
  - aws-documentation
  - aws-iac
  - aws-mcp
  - chronos-graph
  - codegraph
  - coderabbit
  - filesystem
  - github-official
  - greptile
  - nexus
  - semgrep
  - sentry-remote
  - sequentialthinking
  - skillport
  - sonarqube
