# bitbucket-pipelines.yml
image: node:20

pipelines:
  default:
    - step:
        name: Validate Skill Locations
        script:
          - chmod +x scripts/validate_skills_locations.sh
          - ./scripts/validate_skills_locations.sh
  pull-requests:
    '**':
      - step:
          name: Validate Skill Locations
          script:
            - chmod +x scripts/validate_skills_locations.sh
            - ./scripts/validate_skills_locations.sh
