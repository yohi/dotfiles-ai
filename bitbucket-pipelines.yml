# bitbucket-pipelines.yml
image: node:20

pipelines:
  default:
    - step:
        name: Validate Skill Locations
        script:
          - chmod +x _scripts/validate_skills_locations.sh
          - ./_scripts/validate_skills_locations.sh
  pull-requests:
    '**':
      - step:
          name: Validate Skill Locations
          script:
            - chmod +x _scripts/validate_skills_locations.sh
            - ./_scripts/validate_skills_locations.sh
