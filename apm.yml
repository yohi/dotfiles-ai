name: dotfiles-ai
version: 2.0.0
description: AI Agent settings, skills, and unified MCP configuration for 
  dotfiles

# CodeRabbit & Greptile Skills
skills:
  - coderabbitai/skills
  - greptileai/skills//check-pr
  - greptileai/skills//greploop

# APM Standard Dependencies
dependencies:
  # Skills
  apm:
    - obra/superpowers#v6.1.1
    - anthropics/skills
    - coderabbitai/skills
    - greptileai/skills//check-pr
    - greptileai/skills//greploop
    - anthropics/claude-code//plugins/code-review
    # - yohi/agent-skills//skills/doc-sync-verifier
    - yohi/agent-skills//skills/git-master
    - yohi/agent-skills//skills/github-quality-setup
    - yohi/agent-skills//skills/makefile-organization
    - yohi/agent-skills//skills/github-release-packages

  # MCP Servers
  mcp:
    - name: atlassian
      title: "Atlassian MCP"
      registry: false
      transport: sse
      url: "https://mcp.atlassian.com/v1/mcp"
      headers:
        Authorization: "${env:ATLASSIAN_AUTH_HEADER}"
      enabled: true

    - name: coderabbit
      title: "CodeRabbit MCP"
      registry: false
      transport: stdio
      command: "npx"
      args:
        - "-y"
        - "coderabbitai-mcp"
      env:
        GITHUB_PAT: "${env:GITHUB_TOKEN}"
      timeout: 60000
      enabled: true

    - name: codegraph
      title: "CodeGraph MCP"
      registry: false
      transport: stdio
      command: "_scripts/codegraph-bootstrap.sh"
      args:
        - "serve"
        - "--mcp"
      enabled: true

    - name: greptile
      title: "Greptile MCP"
      registry: false
      transport: sse
      url: "https://api.greptile.com/mcp"
      headers:
        Authorization: "Bearer ${env:GREPTILE_API_KEY}"
        X-GitHub-Token: "${env:GITHUB_TOKEN}"
      enabled: true

    - name: filesystem
      title: "Filesystem MCP"
      registry: false
      transport: stdio
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-filesystem"
        - "${env:PWD}"
      standalone: true
      timeout: 60000
      enabled: true

    - name: sequentialthinking
      title: "Sequential Thinking MCP"
      registry: false
      transport: stdio
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-sequential-thinking"
      env:
        DISABLE_THOUGHT_LOGGING: "${env:DISABLE_THOUGHT_LOGGING:-true}"
      standalone: true
      timeout: 60000
      enabled: true

    - name: github-official
      title: "GitHub Official MCP"
      registry: false
      transport: sse
      url: "https://api.githubcopilot.com/mcp/"
      standalone: true
      enabled: true
      headers:
        Authorization: "Bearer ${env:GITHUB_TOKEN}"

    - name: aws-iac
      title: "AWS IaC MCP"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "awslabs.aws-iac-mcp-server"
      env:
        AWS_PROFILE: "${env:AWS_PROFILE:-default}"
        AWS_REGION: "${env:AWS_REGION:-us-east-1}"
        FASTMCP_LOG_LEVEL: "ERROR"
      standalone: true
      timeout: 60000
      enabled: true


    - name: aws-documentation
      title: "AWS Documentation MCP"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "awslabs.aws-documentation-mcp-server==1.0.0"
      env:
        FASTMCP_LOG_LEVEL: "ERROR"
        AWS_DOCUMENTATION_PARTITION: "${env:AWS_DOCUMENTATION_PARTITION:-aws}"
      standalone: true
      enabled: true

    - name: aws-mcp
      title: "AWS Managed MCP"
      registry: false
      transport: sse
      url: "https://aws-mcp.us-east-1.api.aws/mcp?oauth=initialize"
      enabled: true

    - name: sentry-remote
      title: "Sentry Remote MCP"
      registry: false
      transport: sse
      url: "https://mcp.sentry.dev/mcp"
      enabled: true

    - name: sonarqube
      title: "SonarQube MCP"
      registry: false
      transport: stdio
      command: "npx"
      args:
        - "-y"
        - "sonarqube-mcp-server"
      env:
        SONARQUBE_TOKEN: "${env:SONARQUBE_TOKEN}"
        SONARQUBE_URL: "${env:SONARQUBE_URL}"
        SONARQUBE_ORG: "${env:SONARQUBE_ORG}"
      timeout: 60000
      enabled: true

    - name: semgrep
      title: "Semgrep MCP"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "semgrep-mcp"
        - "-t"
        - "stdio"
        - "--semgrep-path"
        - "${env:HOME}/.local/bin/semgrep"
      env:
        SEMGREP_APP_TOKEN: "${env:SEMGREP_APP_TOKEN}"
      enabled: true
      timeout: 60000

    - name: skillport
      title: "Skillport"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "skillport-mcp"
      env:
        SKILLPORT_SKILLS_DIR: "${env:SKILLPORT_SKILLS_DIR:-.agents/skills}"
      standalone: true
      timeout: 60000
      enabled: true

    - name: nexus
      title: "Nexus"
      registry: false
      transport: stdio
      command: "npx"
      args:
        - "-y"
        - "@yohi/nexus@1.29.0"
        - "http-bridge"
      env:
        LOG_LEVEL: "ERROR"
        NEXUS_WATCHER_IGNORE_PATHS: "node_modules,opencode/node_modules,.opencode/node_modules,oss/apm/node_modules,oss/apm/docs/node_modules,.git,.nexus,dist,gemini,agent-skills,apm_modules,.agents,.opencode,.gemini,.claude,.codex,.vscode,.devcontainer,oss,codex/.tmp,.worktrees,.venv,target,.mypy_cache,.ruff_cache,build,.serena,.cache,__pycache__,*.db,*.sqlite,*.log"
        CHOKIDAR_USEPOLLING: "false"
        CHOKIDAR_INTERVAL: "2000"
        NO_PROXY: "127.0.0.1,localhost"
      timeout: 60000
      standalone: true
      enabled: true

    - name: chronos-graph
      title: "Chronos Graph"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "--from"
        - "context-store-mcp[all] @ https://github.com/yohi/chronos-graph/archive/refs/tags/v3.0.0.tar.gz"
        - "context-store"
      env:
        STORAGE_BACKEND: "${env:STORAGE_BACKEND}"
        GRAPH_ENABLED: "${env:GRAPH_ENABLED}"
        POSTGRES_HOST: "${env:POSTGRES_HOST}"
        POSTGRES_PORT: "${env:POSTGRES_PORT}"
        POSTGRES_DB: "${env:POSTGRES_DB}"
        POSTGRES_USER: "${env:POSTGRES_USER}"
        POSTGRES_PASSWORD: "${env:POSTGRES_PASSWORD}"
        POSTGRES_SSL: "${env:POSTGRES_SSL}"
        NEO4J_URI: "${env:NEO4J_URI}"
        NEO4J_USER: "${env:NEO4J_USER}"
        NEO4J_PASSWORD: "${env:NEO4J_PASSWORD}"
        CACHE_BACKEND: "${env:CACHE_BACKEND}"
        REDIS_URL: "${env:REDIS_URL}"
        REDIS_SSL: "${env:REDIS_SSL}"
        EMBEDDING_PROVIDER: "${env:EMBEDDING_PROVIDER}"
        LOCAL_MODEL_NAME: "${env:LOCAL_MODEL_NAME}"
        EMBEDDING_DIMENSION: "${env:EMBEDDING_DIMENSION}"
        SIMILARITY_THRESHOLD: "${env:SIMILARITY_THRESHOLD}"
        DEDUP_THRESHOLD: "${env:DEDUP_THRESHOLD}"
        DEFAULT_TOP_K: "${env:DEFAULT_TOP_K}"
        DECAY_HALF_LIFE_DAYS: "${env:DECAY_HALF_LIFE_DAYS}"
        ARCHIVE_THRESHOLD: "${env:ARCHIVE_THRESHOLD}"
        PURGE_RETENTION_DAYS: "${env:PURGE_RETENTION_DAYS}"
        DASHBOARD_HOST: "${env:DASHBOARD_HOST}"
        DASHBOARD_PORT: "${env:DASHBOARD_PORT}"
      standalone: true
      timeout: 120000
      enabled: true

# --------------------------------------------------------------------------
# Global Agent Settings (Inherited by all targets)
# --------------------------------------------------------------------------
default_agent: sisyphus
shell: bash
snapshot: true

plugin:
  - "@yohi/justice@2.4.0"
  - "@yohi/akane@1.6.2"
  - "oh-my-openagent@4.19.0"
  - "@yohi/chronos-gate@1.1.0"
  - "@nick-vi/opencode-type-inject@latest"
  - "opencode-vibeguard@latest"

disabled_providers:
  - google
  - cursor

permission:
  "*": ask
  "todowrite": allow
  read: allow
  edit: allow
  glob: allow
  grep: allow
  task: allow
  skill: allow
  lsp: allow
  webfetch: allow
  websearch: allow
  skillport_*: allow
  mcp_skillport_*: allow
  mcp__skillport__*: allow
  skillport_load_skill: allow
  nexus_*: allow
  mcp_nexus_*: allow
  chronos-graph_*: allow
  mcp_chronos-graph_*: allow
  external_directory: ask
  doom_loop: ask
  # Bash: base ASK, common-safe commands ALLOW, dangerous commands DENY.
  # Matching is sequential (last-match-wins): rules are evaluated top-down,
  # so the dangerous deny rules MUST be placed after the broad allows below.
  bash:
    "*": ask

    # --- read-only inspection ---
    "ls*": allow
    "cat*": allow
    "head*": allow
    "tail*": allow
    "less*": allow
    "more*": allow
    "wc*": allow
    "cut*": allow
    "sort*": allow
    "uniq*": allow
    "tr*": allow
    "column*": allow
    "tee*": allow
    "xargs*": allow
    "diff*": allow
    "comm*": allow
    "grep*": allow
    "rg*": allow
    "find*": allow
    "fd*": allow
    "tree*": allow
    "stat*": allow
    "file*": allow
    "basename*": allow
    "dirname*": allow
    "realpath*": allow
    "readlink*": allow
    "du*": allow
    "df*": allow
    "curl*": allow

    # --- system info ---
    "pwd*": allow
    "cd*": allow
    "echo*": allow
    "printf*": allow
    "which*": allow
    "whereis*": allow
    "type*": allow
    "id*": allow
    "whoami*": allow
    "uname*": allow
    "hostname*": allow
    "date*": allow
    "env*": allow
    "printenv*": allow
    "ps*": allow
    "lsof*": allow
    "ss*": allow
    "netstat*": allow
    "sleep*": allow
    "seq*": allow
    "test*": allow

    # --- text processing ---
    "jq*": allow
    "yq*": allow
    "sed*": allow
    "awk*": allow

    # --- archives ---
    "tar*": allow
    "zip*": allow
    "unzip*": allow
    "gzip*": allow
    "gunzip*": allow

    # --- file ops (create/copy; destructive forms denied below) ---
    "mkdir*": allow
    "touch*": allow
    "cp*": allow
    "mv*": allow
    "ln*": allow

    # --- build / package managers / runtimes ---
    "make*": allow
    "uv*": allow
    "npm*": allow
    "npx*": allow
    "pnpm*": allow
    "yarn*": allow
    "bun*": allow
    "node*": allow
    "python*": allow
    "python3*": allow
    "pip*": allow
    "pip3*": allow
    "gh*": allow
    "eslint*": allow
    "devcontainer*": allow
    "docker*": allow

    # --- git: read-only & safe operations ---
    "git status*": allow
    "git log*": allow
    "git diff*": allow
    "git show*": allow
    "git blame*": allow
    "git ls-files*": allow
    "git rev-parse*": allow
    "git remote*": allow
    "git tag*": allow
    "git branch*": allow
    "git fetch*": allow
    "git stash*": allow
    "git describe*": allow
    "git shortlog*": allow
    "git check-ignore*": allow
    "git config --get*": allow
    "git commit*": allow
    "git checkout*": allow
    "git merge*": allow
    "git rebase*": allow
    "git pull*": allow
    "git add*": allow

    # git: env-var-prefixed read-only (GIT_MASTER=1 etc)
    "GIT_MASTER=1 git status*": allow
    "GIT_MASTER=1 git diff*": allow
    "GIT_MASTER=1 git log*": allow
    "GIT_MASTER=1 git branch*": allow
    "GIT_MASTER=1 git merge-base*": allow
    "GIT_MASTER=1 git rev-parse*": allow

    # === DANGEROUS: ask for confirmation instead of hard deny for most ops ===
    # destructive git
    "git add .": ask
    "git add -A*": ask
    "git add --all*": ask
    "git add :/*": ask
    "git add -u*": ask
    "git push*": ask
    "git reset --hard*": ask
    "git clean -fd*": ask
    "git clean -xfd*": ask
    # destructive filesystem
    "rm -rf*": ask
    "rm -fr*": ask
    "rm -r *": ask
    # publish / system power
    "npm publish*": ask
    "shutdown*": ask
    "reboot*": ask
    "halt*": ask
    "poweroff*": ask
    # repo-specific
    "bash _scripts/*": ask

    # git master branch push (last-match-wins after the ask rule)
    "git push* master": deny
    "git push* master *": deny
    # === TRULY DANGEROUS: hard deny (privilege escalation, disk destruction, RCE) ===
    "dd *": deny
    "mkfs*": deny
    "shred*": deny
    "sudo*": deny
    "su *": deny
    "doas*": deny
    "curl* | sh": deny
    "curl* | bash": deny
    "curl*|sh": deny
    "curl*|bash": deny
    "wget* | sh": deny
    "wget* | bash": deny
    "wget*|sh": deny
    "wget*|bash": deny

compaction:
  auto: true
  reserved: 15000
  tail_turns: 3
  prune: true

share: manual

lsp:
  typescript-language-server:
    command: ["typescript-language-server", "--stdio"]
    extensions: [".ts", ".tsx", ".js", ".jsx"]
    initialization:
      preferences:
        includeInlayParameterNameHints: "all"
        includeInlayVariableTypeHints: true
        includeInlayFunctionParameterTypeHints: true
        disableSuggestions: false
      diagnostics:
        ignoredCodes: [6133]
  bash-language-server:
    command: ["bash-language-server", "start"]
    extensions: [".sh"]
  pyright:
    command: ["pyright-langserver", "--stdio"]
    extensions: [".py"]
    initialization:
      python:
        analysis:
          typeCheckingMode: "strict"
          autoSearchPaths: true
          useLibraryCodeForTypes: true
  markdownlint:
    command: ["npx", "markdownlint-lsp", "--stdio"]
    extensions: [".md"]
  mypy:
    command: ["mypy", "--ignore-missing-imports", "--follow-imports=silent", "--strict"]
    extensions: [".py"]
  shellcheck:
    command: ["shellcheck", "-f", "gcc", "--severity=style"]
    extensions: [".sh"]
  eslint:
    command: ["eslint", "--format", "stylish", "--max-warnings", "0"]
    extensions: [".ts", ".tsx", ".js", ".jsx"]

instructions:
  - global-rules/AGENTS.global.md
  - .agents/skills/superpowers/using-superpowers/SKILL.md

watcher:
  ignore:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/coverage/**"
    - "**/*.lock"
    - "**/.git/**"

enabled_providers:
  - openai
  - cloudflare-ai-gateway-custom
  - opencode
  - opencode-go
  - ollama-cloud
  - amazon-bedrock

provider:
  cloudflare-ai-gateway-custom:
    npm: "@ai-sdk/openai-compatible"
    name: "Cloudflare AI Gateway(Custom)"
    options:
      baseURL: "https://gateway.ai.cloudflare.com/v1/${env:CLOUDFLARE_ACCOUNT_ID}/${env:CLOUDFLARE_GATEWAY_ID}/compat"
      headers:
        cf-aig-authorization: "Bearer ${env:CLOUDFLARE_API_TOKEN}"
    models:
      dynamic/kimi-k2.6:
        name: Kimi K2.6
      dynamic/kimi-k2.7-code:
        name: Kimi K2.7 Code
      dynamic/kimi-k3:
        name: Kimi K3
      dynamic/glm-5.2:
        name: GLM 5.2
      dynamic/gemini-3.1-pro-preview:
        name: Gemini 3.1 Pro(Preview)
      dynamic/gemini-3.5-flash:
        name: Gemini 3.5 Flash
      # dynamic/test:
      #   name: test
      # custom-nvidia/moonshotai/kimi-k2.6:
      #   name: Kimi K2.6(Nvidia)
  openai:
    whitelist:
      - gpt-5.3-codex
      - gpt-5.3-codex-spark
      - gpt-5.4
      - gpt-5.4-mini
      - gpt-5.4-nano
      - gpt-5.4-pro
      - gpt-5.5
      - gpt-5.5-pro
      - gpt-5.6
      - gpt-5.6-luna
      - gpt-5.6-sol
      - gpt-5.6-terra
  opencode:
    whitelist:
      - big-pickle
      - deepseek-v4-flash-free
      - mimo-v2.5-free
      - north-mini-code-free
      - nemotron-3-ultra-free
  amazon-bedrock:
    whitelist:
      - global.anthropic.claude-fable-5
      - global.anthropic.claude-haiku-4-5-20251001-v1:0
      - global.anthropic.claude-opus-4-5-20251101-v1:0
      - global.anthropic.claude-opus-4-6-v1
      - global.anthropic.claude-opus-4-7
      - global.anthropic.claude-opus-4-8
      - global.anthropic.claude-sonnet-4-5-20250929-v1:0
      - global.anthropic.claude-sonnet-4-6
      - global.anthropic.claude-sonnet-5
      - openai.gpt-5.4
      - openai.gpt-5.5
      - openai.gpt-oss-120b
      - openai.gpt-oss-120b-1:0
      - openai.gpt-oss-20b
      - openai.gpt-oss-20b-1:0
      - openai.gpt-oss-safeguard-120b
      - openai.gpt-oss-safeguard-20b
experimental:
  batch_tool: true
  openTelemetry: true
  continue_loop_on_deny: false
  mcp_timeout: 120000
  watchdog:
    enabled: true
    stage1Ms: 180000
    stage2Ms: 180000
    maxPings: 1
    tmux:
      highlightWindow: true

# APM Standard Targets
targets:
  - opencode

# Exported Artifacts
exports:
  skills:
    - agent-skills/**
  instructions:
    - global-rules/AGENTS.global.md
  # OpenCode platform config (symlinked to ~/.config/opencode/ via `make setup-opencode`)
  # Deployed by: apm-install -> setup-opencode -> _mk/opencode.mk link_config
  configs:
    - opencode/opencode.jsonc
