name: dotfiles-ai
version: 2.0.0
description: AI Agent settings, skills, and unified MCP configuration for 
  dotfiles

# CodeRabbit & Greptile Skills
skills:
  - coderabbitai/skills
  - greptileai/skills//check-pr
  - greptileai/skills//greploop

# APM Standard Dependencies
dependencies:
  # Skills
  apm:
    - obra/superpowers#v6.2.0
    - anthropics/skills
    - coderabbitai/skills
    - greptileai/skills//check-pr
    - greptileai/skills//greploop
    - anthropics/claude-code//plugins/code-review
    - github/gh-stack
    # - yohi/agent-skills//skills/doc-sync-verifier
    - yohi/agent-skills//skills/git-master
    - yohi/agent-skills//skills/github-quality-setup
    - yohi/agent-skills//skills/github-release-packages
    - yohi/agent-skills//skills/temporary-credential-agent

  # MCP Servers
  mcp:
    - name: cf-mcp-portal-personal
      title: "Cloudflare MCP Portal (Personal)"
      registry: false
      transport: streamable-http
      url: https://personal.mcp.y-ohi.com/mcp
      enabled: true


    - name: coderabbit
      title: "CodeRabbit MCP"
      registry: false
      transport: stdio
      command: "npx"
      args:
        - "-y"
        - "coderabbitai-mcp"
      env:
        GITHUB_PAT: "${env:GITHUB_TOKEN}"
      timeout: 60000
      enabled: true

    - name: codegraph
      title: "CodeGraph MCP"
      registry: false
      transport: stdio
      command: "_scripts/codegraph-bootstrap.sh"
      args:
        - "serve"
        - "--mcp"
      enabled: true

    - name: greptile
      title: "Greptile MCP"
      registry: false
      transport: sse
      url: "https://api.greptile.com/mcp"
      headers:
        Authorization: "Bearer ${env:GREPTILE_API_KEY}"
        X-GitHub-Token: "${env:GITHUB_TOKEN}"
      enabled: true

    - name: filesystem
      title: "Filesystem MCP"
      registry: false
      transport: stdio
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-filesystem"
        - "${env:PWD}"
      standalone: true
      timeout: 60000
      enabled: true

    - name: sequentialthinking
      title: "Sequential Thinking MCP"
      registry: false
      transport: stdio
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-sequential-thinking"
      env:
        DISABLE_THOUGHT_LOGGING: "${env:DISABLE_THOUGHT_LOGGING:-true}"
      standalone: true
      timeout: 60000
      enabled: true

    - name: github-official
      title: "GitHub Official MCP"
      registry: false
      transport: sse
      url: "https://api.githubcopilot.com/mcp/"
      standalone: true
      enabled: true
      headers:
        Authorization: "Bearer ${env:GITHUB_TOKEN}"

    - name: aws-iac
      title: "AWS IaC MCP"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "awslabs.aws-iac-mcp-server"
      env:
        AWS_PROFILE: "${env:AWS_PROFILE:-default}"
        AWS_REGION: "${env:AWS_REGION:-us-east-1}"
        FASTMCP_LOG_LEVEL: "ERROR"
      standalone: true
      timeout: 60000
      enabled: true


    - name: aws-documentation
      title: "AWS Documentation MCP"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "awslabs.aws-documentation-mcp-server==1.0.0"
      env:
        FASTMCP_LOG_LEVEL: "ERROR"
        AWS_DOCUMENTATION_PARTITION: "${env:AWS_DOCUMENTATION_PARTITION:-aws}"
      standalone: true
      enabled: true

    - name: aws-mcp
      title: "AWS Managed MCP"
      registry: false
      transport: sse
      url: "https://aws-mcp.us-east-1.api.aws/mcp?oauth=initialize"
      enabled: true

    - name: sentry-remote
      title: "Sentry Remote MCP"
      registry: false
      transport: sse
      url: "https://mcp.sentry.dev/mcp"
      enabled: true

    - name: sonarqube
      title: "SonarQube MCP"
      registry: false
      transport: stdio
      command: "npx"
      args:
        - "-y"
        - "sonarqube-mcp-server"
      env:
        SONARQUBE_TOKEN: "${env:SONARQUBE_TOKEN}"
        SONARQUBE_URL: "${env:SONARQUBE_URL}"
        SONARQUBE_ORG: "${env:SONARQUBE_ORG}"
      timeout: 60000
      enabled: true

    - name: semgrep
      title: "Semgrep MCP"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "semgrep-mcp"
        - "-t"
        - "stdio"
        - "--semgrep-path"
        - "${env:HOME}/.local/bin/semgrep"
      env:
        SEMGREP_APP_TOKEN: "${env:SEMGREP_APP_TOKEN}"
      enabled: true
      timeout: 60000

    - name: skillport
      title: "Skillport"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "skillport-mcp"
      env:
        SKILLPORT_SKILLS_DIR: "${env:SKILLPORT_SKILLS_DIR:-.agents/skills}"
      standalone: true
      timeout: 60000
      enabled: true

    - name: nexus
      title: "Nexus"
      registry: false
      transport: stdio
      command: "npx"
      args:
        - "-y"
        - "@yohi/nexus@2.1.0"
        - "http-bridge"
      env:
        LOG_LEVEL: "ERROR"
        NEXUS_WATCHER_IGNORE_PATHS: "node_modules,opencode/node_modules,.opencode/node_modules,oss/apm/node_modules,oss/apm/docs/node_modules,.git,.nexus,dist,gemini,agent-skills,apm_modules,.agents,.opencode,.gemini,.claude,.codex,.vscode,.devcontainer,oss,codex/.tmp,.worktrees,.venv,target,.mypy_cache,.ruff_cache,build,.serena,.cache,__pycache__,*.db,*.sqlite,*.log"
        CHOKIDAR_USEPOLLING: "false"
        CHOKIDAR_INTERVAL: "2000"
        NO_PROXY: "127.0.0.1,localhost"
      timeout: 60000
      standalone: true
      enabled: true

    - name: chronos-graph
      title: "Chronos Graph"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "--from"
        - "context-store-mcp[all] @ https://github.com/yohi/chronos-graph/archive/refs/tags/v3.1.0.tar.gz"
        - "context-store"
      env:
        STORAGE_BACKEND: "${env:STORAGE_BACKEND}"
        GRAPH_ENABLED: "${env:GRAPH_ENABLED}"
        POSTGRES_HOST: "${env:POSTGRES_HOST}"
        POSTGRES_PORT: "${env:POSTGRES_PORT}"
        POSTGRES_DB: "${env:POSTGRES_DB}"
        POSTGRES_USER: "${env:POSTGRES_USER}"
        POSTGRES_PASSWORD: "${env:POSTGRES_PASSWORD}"
        POSTGRES_SSL: "${env:POSTGRES_SSL}"
        NEO4J_URI: "${env:NEO4J_URI}"
        NEO4J_USER: "${env:NEO4J_USER}"
        NEO4J_PASSWORD: "${env:NEO4J_PASSWORD}"
        CACHE_BACKEND: "${env:CACHE_BACKEND}"
        REDIS_URL: "${env:REDIS_URL}"
        REDIS_SSL: "${env:REDIS_SSL}"
        EMBEDDING_PROVIDER: "${env:EMBEDDING_PROVIDER}"
        LOCAL_MODEL_NAME: "${env:LOCAL_MODEL_NAME}"
        EMBEDDING_DIMENSION: "${env:EMBEDDING_DIMENSION}"
        SIMILARITY_THRESHOLD: "${env:SIMILARITY_THRESHOLD}"
        DEDUP_THRESHOLD: "${env:DEDUP_THRESHOLD}"
        DEFAULT_TOP_K: "${env:DEFAULT_TOP_K}"
        DECAY_HALF_LIFE_DAYS: "${env:DECAY_HALF_LIFE_DAYS}"
        ARCHIVE_THRESHOLD: "${env:ARCHIVE_THRESHOLD}"
        PURGE_RETENTION_DAYS: "${env:PURGE_RETENTION_DAYS}"
        DASHBOARD_HOST: "${env:DASHBOARD_HOST}"
        DASHBOARD_PORT: "${env:DASHBOARD_PORT}"
      standalone: true
      timeout: 120000
      enabled: true

# --------------------------------------------------------------------------
# Global Agent Settings (Inherited by all targets)
# --------------------------------------------------------------------------
default_agent: sisyphus
agent:
  title:
    disable: true
shell: bash
snapshot: true

plugin:
  - "@yohi/justice@3.0.0"
  - "@yohi/akane@1.6.2"
  # - "@yohi/sibyl/server@1.0.0"
  - "file:///home/y_ohi/program/private/sibyl/dist/server.js"
  - "oh-my-openagent@4.19.4"
  - "@yohi/chronos-gate@1.1.0"
  - "@nick-vi/opencode-type-inject@latest"
  - "opencode-vibeguard@latest"

disabled_providers: []

permission:
  "*": ask
  "todowrite": allow
  read: allow
  edit: allow
  glob: allow
  grep: allow
  task: allow
  skill: allow
  lsp: allow
  webfetch: allow
  websearch: allow
  skillport_*: allow
  mcp_skillport_*: allow
  mcp__skillport__*: allow
  skillport_load_skill: allow
  nexus_*: allow
  mcp_nexus_*: allow
  chronos-graph_*: allow
  mcp_chronos-graph_*: allow
  external_directory: ask
  doom_loop: ask
  # Bash: base ASK, common-safe commands ALLOW, dangerous commands DENY.
  # Matching is sequential (last-match-wins): rules are evaluated top-down,
  # so the dangerous deny rules MUST be placed after the broad allows below.
  bash:
    "*": ask

    # --- read-only inspection ---
    "ls*": allow
    "cat*": allow
    "head*": allow
    "tail*": allow
    "less*": allow
    "more*": allow
    "wc*": allow
    "cut*": allow
    "sort*": allow
    "uniq*": allow
    "tr*": allow
    "column*": allow
    "tee*": allow
    "xargs*": allow
    "diff*": allow
    "comm*": allow
    "grep*": allow
    "rg*": allow
    "find*": allow
    "fd*": allow
    "tree*": allow
    "stat*": allow
    "file*": allow
    "basename*": allow
    "dirname*": allow
    "realpath*": allow
    "readlink*": allow
    "du*": allow
    "df*": allow
    "curl*": allow

    # --- system info ---
    "pwd*": allow
    "cd*": allow
    "echo*": allow
    "printf*": allow
    "which*": allow
    "whereis*": allow
    "type*": allow
    "id*": allow
    "whoami*": allow
    "uname*": allow
    "hostname*": allow
    "date*": allow
    "env*": allow
    "printenv*": allow
    "ps*": allow
    "lsof*": allow
    "ss*": allow
    "netstat*": allow
    "sleep*": allow
    "seq*": allow
    "test*": allow

    # --- text processing ---
    "jq*": allow
    "yq*": allow
    "sed*": allow
    "awk*": allow

    # --- archives ---
    "tar*": allow
    "zip*": allow
    "unzip*": allow
    "gzip*": allow
    "gunzip*": allow

    # --- file ops (create/copy; destructive forms denied below) ---
    "mkdir*": allow
    "touch*": allow
    "cp*": allow
    "mv*": allow
    "ln*": allow

    # --- build / package managers / runtimes ---
    "make*": allow
    "uv*": allow
    "npm*": allow
    "npx*": allow
    "pnpm*": allow
    "yarn*": allow
    "bun*": allow
    "node*": allow
    "python*": allow
    "python3*": allow
    "pip*": allow
    "pip3*": allow
    "gh*": allow
    "eslint*": allow
    "devcontainer*": allow
    "docker*": allow

    # --- git: read-only & safe operations ---
    "git status*": allow
    "git log*": allow
    "git diff*": allow
    "git show*": allow
    "git blame*": allow
    "git ls-files*": allow
    "git rev-parse*": allow
    "git remote*": allow
    "git tag*": allow
    "git branch*": allow
    "git fetch*": allow
    "git stash*": allow
    "git describe*": allow
    "git shortlog*": allow
    "git check-ignore*": allow
    "git config --get*": allow
    "git commit*": allow
    "git checkout*": allow
    "git merge*": allow
    "git rebase*": allow
    "git pull*": allow
    "git add*": allow

    # git: env-var-prefixed read-only (GIT_MASTER=1 etc)
    "GIT_MASTER=1 git status*": allow
    "GIT_MASTER=1 git diff*": allow
    "GIT_MASTER=1 git log*": allow
    "GIT_MASTER=1 git branch*": allow
    "GIT_MASTER=1 git merge-base*": allow
    "GIT_MASTER=1 git rev-parse*": allow

    # === DANGEROUS: ask for confirmation instead of hard deny for most ops ===
    # destructive git
    "git add .": ask
    "git add -A*": ask
    "git add --all*": ask
    "git add :/*": ask
    "git add -u*": ask
    "git push*": ask
    "git reset --hard*": ask
    "git clean -fd*": ask
    "git clean -xfd*": ask
    # destructive filesystem
    "rm -rf*": ask
    "rm -fr*": ask
    "rm -r *": ask
    # publish / system power
    "npm publish*": ask
    "shutdown*": ask
    "reboot*": ask
    "halt*": ask
    "poweroff*": ask
    # repo-specific
    "bash _scripts/*": ask

    # git master branch push (last-match-wins after the ask rule)
    "git push* master": deny
    "git push* master *": deny
    # === TRULY DANGEROUS: hard deny (privilege escalation, disk destruction, RCE) ===
    "dd *": deny
    "mkfs*": deny
    "shred*": deny
    "sudo*": deny
    "su *": deny
    "doas*": deny
    "curl* | sh": deny
    "curl* | bash": deny
    "curl*|sh": deny
    "curl*|bash": deny
    "wget* | sh": deny
    "wget* | bash": deny
    "wget*|sh": deny
    "wget*|bash": deny

compaction:
  auto: true
  reserved: 15000
  tail_turns: 3
  prune: true

share: manual

lsp:
  typescript-language-server:
    command: ["typescript-language-server", "--stdio"]
    extensions: [".ts", ".tsx", ".js", ".jsx"]
    initialization:
      preferences:
        includeInlayParameterNameHints: "all"
        includeInlayVariableTypeHints: true
        includeInlayFunctionParameterTypeHints: true
        disableSuggestions: false
      diagnostics:
        ignoredCodes: [6133]
  bash-language-server:
    command: ["bash-language-server", "start"]
    extensions: [".sh"]
  pyright:
    command: ["pyright-langserver", "--stdio"]
    extensions: [".py"]
    initialization:
      python:
        analysis:
          typeCheckingMode: "strict"
          autoSearchPaths: true
          useLibraryCodeForTypes: true
  markdownlint:
    command: ["npx", "markdownlint-lsp", "--stdio"]
    extensions: [".md"]
  mypy:
    command: ["mypy", "--ignore-missing-imports", "--follow-imports=silent", "--strict"]
    extensions: [".py"]
  shellcheck:
    command: ["shellcheck", "-f", "gcc", "--severity=style"]
    extensions: [".sh"]
  eslint:
    command: ["eslint", "--format", "stylish", "--max-warnings", "0"]
    extensions: [".ts", ".tsx", ".js", ".jsx"]

instructions:
  - global-rules/AGENTS.global.md
  - .agents/skills/superpowers/using-superpowers/SKILL.md

watcher:
  ignore:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/coverage/**"
    - "**/*.lock"
    - "**/.git/**"

enabled_providers:
  - openai
  - cloudflare-ai-gateway
  - cloudflare-ai-gateway-custom
  - cloudflare-ai-gateway-octg
  - opencode
  - ollama-cloud
  - opencode-go
  - amazon-bedrock
  - google

provider:
  cloudflare-ai-gateway:
    npm: "ai-gateway-provider"
    options:
      accountId: "${env:OC_CF_ACCOUNT_ID}"
      gatewayId: "${env:OC_CF_GATEWAY_ID}"
      apiKey: "${env:OC_CF_API_TOKEN}"
    models:
      # OpenAI
      openai/gpt-5.6-luna:
        name: GPT-5.6 Luna (OpenAI)
        variants:
          default:
            reasoningEffort: max
          none:
            reasoningEffort: none
          low:
            reasoningEffort: low
          medium:
            reasoningEffort: medium
          high:
            reasoningEffort: high
          xhigh:
            reasoningEffort: xhigh
          max:
            reasoningEffort: max
      openai/gpt-5.6-terra:
        name: GPT-5.6 Terra (OpenAI)
        variants:
          default:
            reasoningEffort: high
          none:
            reasoningEffort: none
          low:
            reasoningEffort: low
          medium:
            reasoningEffort: medium
          high:
            reasoningEffort: high
          xhigh:
            reasoningEffort: xhigh
          max:
            reasoningEffort: max
      openai/gpt-5.6-sol:
        name: GPT-5.6 Sol (OpenAI)
        variants:
          default:
            reasoningEffort: high
          none:
            reasoningEffort: none
          low:
            reasoningEffort: low
          medium:
            reasoningEffort: medium
          high:
            reasoningEffort: high
          xhigh:
            reasoningEffort: xhigh
          max:
            reasoningEffort: max

      # Google AI Studio
      google-ai-studio/gemini-3.5-flash-lite:
        name: Gemini 3.5 Flash-Lite
      google-ai-studio/gemini-3.7-flash:
        name: Gemini 3.7 Flash
      google-ai-studio/gemini-3.1-pro:
        name: Gemini 3.1 Pro

      # OpenRouter
      openrouter/z-ai/glm-5.2:Free:
        name: GLM 5.2 Free (OpenRouter)
        variants:
          low:
            reasoningEffort: low
          high:
            reasoningEffort: high
          max:
            reasoningEffort: max

      # Dynamic
      dynamic/kimi-k2.6:
        name: Kimi K2.6 (Dynamic)
      dynamic/kimi-k2.7-code:
        name: Kimi K2.7 Code (Dynamic)
      dynamic/kimi-k3:
        name: Kimi K3 (Dynamic)
      dynamic/glm-5.2:
        name: GLM 5.2 (Dynamic)
        variants:
          low:
            reasoningEffort: low
          high:
            reasoningEffort: high
          max:
            reasoningEffort: max
      dynamic/gemini-3.1-pro-preview:
        name: Gemini 3.1 Pro Preview (Dynamic)
      dynamic/gemini-3.5-flash:
        name: Gemini 3.5 Flash (Dynamic)
      dynamic/k2.6-code-preview-free:
        name: Kimi 2.6 (Free)
      dynamic/ox-alpha:free:
        name: Ox Aplha Free (Dynamic)
        # variants:
        #   low:
        #     reasoningEffort: low
        #   high:
        #     reasoningEffort: high
        #   max:
        #     reasoningEffort: max

  cloudflare-ai-gateway-custom:
    npm: "@ai-sdk/openai-compatible"
    name: "Cloudflare AI Gateway (Custom)"
    options:
      baseURL: "https://gateway.ai.cloudflare.com/v1/${env:OC_CF_ACCOUNT_ID}/${env:OC_CF_GATEWAY_ID}/compat"
      apiKey: ""
      headers:
        Authorization: ""
        cf-aig-authorization: "Bearer ${env:OC_CF_API_TOKEN}"
        cf-aig-collect-log-payload: "true"
        cf-aig-max-attempts: "1"
        cf-aig-skip-cache: "true"
    models:
      # Ollama Cloud
      custom-ollama-cloud/kimi-k2.6:
        name: Kimi K2.6 (Ollama Cloud)
      custom-ollama-cloud/kimi-k2.7-code:
        name: Kimi K2.7 Code (Ollama Cloud)
      custom-ollama-cloud/kimi-k3:
        name: Kimi K3 (Ollama Cloud)
      custom-ollama-cloud/glm-5.2:
        name: GLM 5.2 (Ollama Cloud)
        variants:
          default:
            reasoningEffort: high
          low:
            reasoningEffort: low
          high:
            reasoningEffort: high
          max:
            reasoningEffort: max

      # AIHubMix
      custom-aihubmix/coding-kimi-k3-free:
        name: Coding Kimi K3 Free (AIHubMix)
      custom-aihubmix/k2.6-code-preview-free:
        name: Coding Kimi K2.6 Free (AIHubMix)
      custom-aihubmix/gemini-3.5-flash-lite-free:
        name: Gemini 3.5 Flash-Lite Free (AIHubMix)
      custom-aihubmix/gemini-3.6-flash-lite-free:
        name: Gemini 3.6 Flash Free (AIHubMix)
      custom-aihubmix/coding-glm-5.2-free:
        name: Coding GLM 5.2 Free (AIHubMix)
      custom-aihubmix/glm-5.2-free:
        name: GLM 5.2 Free (AIHubMix)
        variants:
          low:
            reasoningEffort: low
          high:
            reasoningEffort: high
          max:
            reasoningEffort: max

      # ZenMax
      custom-zenmax/z-ai/glm-5.3-free:
        name: GLM 5.3 Free (ZenMax)
        variants:
          low:
            reasoningEffort: low
          high:
            reasoningEffort: high
          max:
            reasoningEffort: max

      # Bluesminds
      custom-bluesminds/z-ai/glm-5.2:
        name: GLM 5.2 (Bluesminds)
        variants:
          low:
            reasoningEffort: low
          high:
            reasoningEffort: high
          max:
            reasoningEffort: max

  cloudflare-ai-gateway-octg:
    # The native OpenAI SDK uses the Responses API, whose tool limit is higher
    # than the Chat Completions API used by openai-compatible.
    npm: "@ai-sdk/openai"
    name: "Cloudflare AI Gateway (OCTG)"
    options:
      # @ai-sdk/openai requires a non-empty key, but the empty Authorization
      # header makes Cloudflare AI Gateway use the Custom Provider's stored key.
      apiKey: "cloudflare-custom-provider"
      baseURL: "https://gateway.ai.cloudflare.com/v1/${env:OCTG_CF_ACCOUNT_ID}/${env:OCTG_CF_GATEWAY_ID}/custom-octg/v1"
      headers:
        Authorization: ""
        cf-aig-authorization: "Bearer ${env:OCTG_CF_API_TOKEN}"
        cf-aig-collect-log-payload: "true"
        cf-aig-max-attempts: "1"
        cf-aig-skip-cache: "true"
    models:
      gpt-5.6-luna:
        name: GPT-5.6 Luna (OCTG)
        variants:
          none:
            reasoningEffort: none
          low:
            reasoningEffort: low
          medium:
            reasoningEffort: medium
          high:
            reasoningEffort: high
          xhigh:
            reasoningEffort: xhigh
          max:
            reasoningEffort: max
      gpt-5.6-terra:
        name: GPT-5.6 Terra (OCTG)
        variants:
          none:
            reasoningEffort: none
          low:
            reasoningEffort: low
          medium:
            reasoningEffort: medium
          high:
            reasoningEffort: high
          xhigh:
            reasoningEffort: xhigh
          max:
            reasoningEffort: max
      gpt-5.6-sol:
        name: GPT-5.6 Sol (OCTG)
        variants:
          none:
            reasoningEffort: none
          low:
            reasoningEffort: low
          medium:
            reasoningEffort: medium
          high:
            reasoningEffort: high
          xhigh:
            reasoningEffort: xhigh
          max:
            reasoningEffort: max

  openai:
    whitelist:
      - gpt-5.6-luna
      - gpt-5.6-sol
      - gpt-5.6-terra
  opencode:
    whitelist:
      - big-pickle
      - deepseek-v4-flash-free
      - mimo-v2.5-free
      - north-mini-code-free
      - nemotron-3-ultra-free
