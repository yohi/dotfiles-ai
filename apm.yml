name: dotfiles-ai
version: 2.0.0
description: AI Agent settings, skills, and unified MCP configuration for 
  dotfiles

# APM Standard Dependencies
dependencies:
  # Skills
  apm:
    - obra/superpowers
    - anthropics/skills

  # MCP Servers
  mcp:
    - name: docker-mcp
      title: "Docker MCP Gateway"
      registry: false
      transport: sse
      url: "http://127.0.0.1:10888/sse"
      headers:
        Authorization: "Bearer ${env:MCP_GATEWAY_TOKEN}"
      enabled: true

    - name: skillport
      title: "Skillport"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "skillport-mcp"
      env:
        SKILLPORT_SKILLS_DIR: "${env:SKILLPORT_SKILLS_DIR}"
      standalone: true
      enabled: true

    - name: nexus
      title: "Nexus"
      registry: false
      transport: stdio
      command: "npx"
      args:
        - "-y"
        # - "/home/y_ohi/program/nexus"
        - "@yohi/nexus@1.13.1"
      env:
        NEXUS_STORAGE_ROOT_DIR: "${env:HOME}/.nexus"
        LOG_LEVEL: "ERROR"
        NEXUS_WATCHER_IGNORE_PATHS: "node_modules,opencode/node_modules,.opencode/node_modules,oss/apm/node_modules,oss/apm/docs/node_modules,.git,.nexus,dist,gemini,agent-skills,apm_modules,.agents,.opencode,.gemini,.claude,.codex,.vscode,.devcontainer,oss,codex/.tmp,.worktrees,.venv,target,.mypy_cache,.ruff_cache,build,.serena,.cache,__pycache__,*.db,*.sqlite,*.log"
        CHOKIDAR_USEPOLLING: "false"
        CHOKIDAR_INTERVAL: "2000"
        NO_PROXY: "127.0.0.1,localhost"
      timeout: 30000
      standalone: true
      enabled: true

    - name: chronos-graph
      title: "Chronos Graph"
      registry: false
      transport: stdio
      command: "uvx"
      args:
        - "--from"
        - "git+https://github.com/yohi/chronos-graph.git[all]"
        - "context-store"
      env:
        STORAGE_BACKEND: "${env:STORAGE_BACKEND}"
        GRAPH_ENABLED: "${env:GRAPH_ENABLED}"
        POSTGRES_HOST: "${env:POSTGRES_HOST}"
        POSTGRES_PORT: "${env:POSTGRES_PORT}"
        POSTGRES_DB: "${env:POSTGRES_DB}"
        POSTGRES_USER: "${env:POSTGRES_USER}"
        POSTGRES_PASSWORD: "${env:POSTGRES_PASSWORD}"
        POSTGRES_SSL: "${env:POSTGRES_SSL}"
        NEO4J_URI: "${env:NEO4J_URI}"
        NEO4J_USER: "${env:NEO4J_USER}"
        NEO4J_PASSWORD: "${env:NEO4J_PASSWORD}"
        CACHE_BACKEND: "${env:CACHE_BACKEND}"
        REDIS_URL: "${env:REDIS_URL}"
        REDIS_SSL: "${env:REDIS_SSL}"
        EMBEDDING_PROVIDER: "${env:EMBEDDING_PROVIDER}"
        LOCAL_MODEL_NAME: "${env:LOCAL_MODEL_NAME}"
        EMBEDDING_DIMENSION: "${env:EMBEDDING_DIMENSION}"
        SIMILARITY_THRESHOLD: "${env:SIMILARITY_THRESHOLD}"
        DEDUP_THRESHOLD: "${env:DEDUP_THRESHOLD}"
        DEFAULT_TOP_K: "${env:DEFAULT_TOP_K}"
        DECAY_HALF_LIFE_DAYS: "${env:DECAY_HALF_LIFE_DAYS}"
        ARCHIVE_THRESHOLD: "${env:ARCHIVE_THRESHOLD}"
        PURGE_RETENTION_DAYS: "${env:PURGE_RETENTION_DAYS}"
        DASHBOARD_HOST: "${env:DASHBOARD_HOST}"
        DASHBOARD_PORT: "${env:DASHBOARD_PORT}"
      standalone: true
      enabled: true

# --------------------------------------------------------------------------
# Global Agent Settings (Inherited by all targets)
# --------------------------------------------------------------------------
default_agent: sisyphus
shell: bash
snapshot: true

plugin:
  - "@yohi/justice@2.3.0"
  - "@yohi/akane@1.1.1"
  - "oh-my-openagent@4.10.0"
  - "@yohi/opencode-plugin-chronos-gate@1.4.0"
  - "@nick-vi/opencode-type-inject@latest"
  - "opencode-vibeguard@latest"

disabled_providers:
  - google
  - cursor

permission:
  "*": ask
  read: allow
  edit: allow
  glob: allow
  grep: allow
  task: allow
  skill: allow
  lsp: allow
  webfetch: allow
  websearch: allow
  skillport_*: allow
  mcp_skillport_*: allow
  mcp__skillport__*: allow
  skillport_load_skill: allow
  nexus_*: allow
  mcp_nexus_*: allow
  chronos-graph_*: allow
  mcp_chronos-graph_*: allow
  external_directory: ask
  doom_loop: ask
  # Bash: base ASK, common-safe commands ALLOW, dangerous commands DENY.
  # Matching is sequential (last-match-wins): rules are evaluated top-down,
  # so the dangerous deny rules MUST be placed after the broad allows below.
  bash:
    "*": ask

    # --- read-only inspection ---
    "ls*": allow
    "cat*": allow
    "head*": allow
    "tail*": allow
    "less*": allow
    "more*": allow
    "wc*": allow
    "cut*": allow
    "sort*": allow
    "uniq*": allow
    "tr*": allow
    "column*": allow
    "tee*": allow
    "xargs*": allow
    "diff*": allow
    "comm*": allow
    "grep*": allow
    "rg*": allow
    "find*": allow
    "fd*": allow
    "tree*": allow
    "stat*": allow
    "file*": allow
    "basename*": allow
    "dirname*": allow
    "realpath*": allow
    "readlink*": allow
    "du*": allow
    "df*": allow

    # --- system info ---
    "pwd*": allow
    "cd*": allow
    "echo*": allow
    "printf*": allow
    "which*": allow
    "whereis*": allow
    "type*": allow
    "id*": allow
    "whoami*": allow
    "uname*": allow
    "hostname*": allow
    "date*": allow
    "env*": allow
    "printenv*": allow
    "ps*": allow
    "lsof*": allow
    "ss*": allow
    "netstat*": allow
    "sleep*": allow
    "seq*": allow
    "test*": allow

    # --- text processing ---
    "jq*": allow
    "yq*": allow
    "sed*": allow
    "awk*": allow

    # --- archives ---
    "tar*": allow
    "zip*": allow
    "unzip*": allow
    "gzip*": allow
    "gunzip*": allow

    # --- file ops (create/copy; destructive forms denied below) ---
    "mkdir*": allow
    "touch*": allow
    "cp*": allow
    "mv*": allow
    "ln*": allow

    # --- build / package managers / runtimes ---
    "make*": allow
    "uv*": allow
    "npm*": allow
    "npx*": allow
    "pnpm*": allow
    "yarn*": allow
    "bun*": allow
    "node*": allow
    "python*": allow
    "python3*": allow
    "pip*": allow
    "pip3*": allow
    "eslint*": allow
    "devcontainer*": allow
    "docker*": allow

    # --- git: read-only & safe operations ---
    "git status*": allow
    "git log*": allow
    "git diff*": allow
    "git show*": allow
    "git blame*": allow
    "git ls-files*": allow
    "git rev-parse*": allow
    "git remote*": allow
    "git tag*": allow
    "git branch*": allow
    "git fetch*": allow
    "git stash*": allow
    "git describe*": allow
    "git shortlog*": allow
    "git check-ignore*": allow
    "git config --get*": allow
    "git commit*": allow
    "git checkout*": allow
    "git merge*": allow
    "git rebase*": allow
    "git pull*": allow
    "git add*": allow

    # === DANGEROUS: hard deny (most-specific match overrides allows) ===
    # destructive git
    "git add .": deny
    "git add -A*": deny
    "git add --all*": deny
    "git add :/*": deny
    "git add -u*": deny
    "git push -f*": deny
    "git push --force*": deny
    "git reset --hard*": deny
    "git clean -fd*": deny
    "git clean -xfd*": deny
    # destructive filesystem
    "rm -rf*": deny
    "rm -fr*": deny
    "rm -r *": deny
    "dd *": deny
    "mkfs*": deny
    "shred*": deny
    # privilege escalation
    "sudo*": deny
    "su *": deny
    "doas*": deny
    # pipe-to-shell (remote code execution)
    "curl* | sh": deny
    "curl* | bash": deny
    "curl*|sh": deny
    "curl*|bash": deny
    "wget* | sh": deny
    "wget* | bash": deny
    "wget*|sh": deny
    "wget*|bash": deny
    # publish / system power
    "npm publish*": deny
    "shutdown*": deny
    "reboot*": deny
    "halt*": deny
    "poweroff*": deny
    # repo-specific
    "bash _scripts/*": deny

compaction:
  auto: true
  reserved: 15000
  tail_turns: 3
  prune: true

share: manual

lsp:
  typescript-language-server:
    command: ["typescript-language-server", "--stdio"]
    extensions: [".ts", ".tsx", ".js", ".jsx"]
    initialization:
      preferences:
        includeInlayParameterNameHints: "all"
        includeInlayVariableTypeHints: true
        includeInlayFunctionParameterTypeHints: true
        disableSuggestions: false
      diagnostics:
        ignoredCodes: [6133]
  bash-language-server:
    command: ["bash-language-server", "start"]
    extensions: [".sh"]
  pyright:
    command: ["pyright-langserver", "--stdio"]
    extensions: [".py"]
    initialization:
      python:
        analysis:
          typeCheckingMode: "strict"
          autoSearchPaths: true
          useLibraryCodeForTypes: true
  markdownlint:
    command: ["npx", "markdownlint-lsp", "--stdio"]
    extensions: [".md"]
  mypy:
    command: ["mypy", "--ignore-missing-imports", "--follow-imports=silent", "--strict"]
    extensions: [".py"]
  shellcheck:
    command: ["shellcheck", "-f", "gcc", "--severity=style"]
    extensions: [".sh"]
  eslint:
    command: ["eslint", "--format", "stylish", "--max-warnings", "0"]
    extensions: [".ts", ".tsx", ".js", ".jsx"]

instructions:
  - global-rules/AGENTS.global.md
  - .agents/skills/superpowers/using-superpowers/SKILL.md

watcher:
  ignore:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/coverage/**"
    - "**/*.lock"
    - "**/.git/**"

