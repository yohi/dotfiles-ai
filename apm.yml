name: dotfiles-ai
version: 1.0.0
description: AI Agent settings, skills, and unified MCP configuration for dotfiles

# APM Standard Dependencies
dependencies:
  # Skills
  apm:
    - obra/superpowers
    - anthropics/skills

  # MCP Servers
  mcp:
    - name: skillport
      title: "Skillport"
      registry: false
      transport: stdio
      command: "uvx"
      args: ["skillport-mcp"]
      env:
        SKILLPORT_SKILLS_DIR: "${HOME}/dotfiles/components/dotfiles-ai/agent-skills"
      standalone: true

    - name: nexus
      title: "Nexus"
      registry: false
      transport: stdio
      command: "npx"
      args: ["-y", "@yohi/nexus@1.7.0"]
      env:
        NEXUS_STORAGE_ROOT_DIR: "${HOME}/.nexus"
        NO_PROXY: "127.0.0.1,localhost"
      standalone: true

    - name: SQLite
      registry: false
      transport: sse
      url: "http://127.0.0.1:10888/sse?server=SQLite"
      env:
        SQLITE_DB_PATH: "${HOME}/.mcp/sqlite/sqlite.db"

    - name: github-official
      registry: false
      transport: sse
      url: "http://127.0.0.1:10888/sse?server=github-official"
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

    - name: sequentialthinking
      registry: false
      transport: sse
      url: "http://127.0.0.1:10888/sse?server=sequentialthinking"

# APM Standard Targets
targets:
  default: [opencode, gemini, claude, cursor, vscode, antigravity, codex]

# Exported Artifacts
exports:
  skills:
    - agent-skills/**
  instructions:
    - global-rules/AGENTS.global.md
